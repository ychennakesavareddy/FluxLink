[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chennalink"
version = "0.1.0"
description = "A standalone developer tool for transferring source-code files"
authors = [{ name = "Senior Engineer", email = "senior@example.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.50.0",
    "rich>=13.7.0",
    "pyperclip>=1.8.2",
    "pydantic>=2.0.0",
    "supabase>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio"
]

[project.scripts]
chennalink = "chennalink.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/chennalink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
