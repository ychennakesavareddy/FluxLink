# =========================================================
# FLUXLINK: NGINX REVERSE PROXY CONFIGURATION
# Domain: fluxlinkbackend.chennareddy.in
# =========================================================

# HTTP — Redirect all traffic to HTTPS (and serve Certbot ACME challenges)
server {
    listen 80;
    listen [::]:80;
    server_name fluxlinkbackend.chennareddy.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Production Reverse Proxy with WebSocket Upgrades
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fluxlinkbackend.chennareddy.in;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/fluxlinkbackend.chennareddy.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fluxlinkbackend.chennareddy.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Maximum upload size for file transfers
    client_max_body_size 50M;

    # API and General HTTP Requests
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # WebSocket Endpoint (/ws/...)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSockets alive without timeout drops
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health Checks
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
